upstream dashboard_app {
    server app:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Static files: served DIRECTLY by nginx (no proxy) ----
    location /_next/static/ {
        alias /var/www/dashboard/_next/static/;
        expires 60m;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Enable gzip for static assets
        gzip on;
        gzip_types text/plain text/css application/javascript;
    }

    # ---- Public static files ----
    location /static/ {
        alias /var/www/dashboard/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- Favicon ----
    location /favicon.ico {
        alias /var/www/dashboard/public/favicon.ico;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- Proxy: everything else to Next.js ----
    location / {
        proxy_pass http://dashboard_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # WebSocket (Next.js HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Health check ----
    location /health {
        proxy_pass http://dashboard_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- API routes: rate limited ----
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://dashboard_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Media/images (if any) ----
    location /_next/image {
        proxy_pass http://dashboard_app;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Cache Next.js image optimization
        proxy_cache_valid 200 30m;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
