services:
  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rebinmas-dashboard-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    volumes:
      - ./prisma:/app/prisma
      - ./keys:/app/keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rebinmas-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rebinmas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - rebinmas-net

networks:
  rebinmas-net:
    driver: bridge
